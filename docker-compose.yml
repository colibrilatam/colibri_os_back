  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      # SEC-002: sin default. Si DATABASE_URL no está definida, Docker
      # Compose falla en vez de caer a una credencial hardcodeada.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requerido — definir en .env o en el entorno}

    ports:
      - "${PORT:-3030}:3030"

  # --- Servicios de utilidad (no arrancan con `docker compose up`) ---
  # Ejecutar migraciones:  docker compose run --rm migrate
  # Sembrar datos:         docker compose run --rm seed
  #
  # SEC-002: migrate y seed NO usan env_file. Solo reciben las variables
  # que necesitan vía `environment`, para no inyectar el .env completo
  # (que puede contener credenciales de producción) en procesos destructivos.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["tools"]
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requerido — definir en .env o en el entorno}
    command: ["npm", "run", "migration:run"]

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["tools"]
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      # SEC-002: sin NODE_ENV: development. Antes este valor desactivaba el
      # guard de production en seed.ts, permitiendo TRUNCATE contra prod.
      # Ahora seed.ts decide en base al NODE_ENV real del entorno.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requerido — definir en .env o en el entorno}
    command: ["npm", "run", "seed"]

volumes:
  pgdata:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:dead:beef:1::/64