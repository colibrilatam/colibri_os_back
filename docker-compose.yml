  app:
    build:
      context: .
      dockerfile: Dockerfile
    #container_name: colibri-back
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescribe lo que traiga el .env para que el backend hable con el
      # contenedor "db" de esta red en lugar de "localhost".
      #DB_HOST: db
      #DB_PORT: 5432
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@DB_HOST:DB_PORT/${DB_NAME:-colibri_db}
    ports:
      - "${PORT:-3030}:3030"
    #depends_on:
      #db:
        #condition: service_healthy

  # --- Servicios de utilidad (no arrancan con `docker compose up`) ---
  # Ejecutar migraciones:  docker compose run --rm migrate
  # Sembrar datos:         docker compose run --rm seed
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      NODE_ENV: development # evita que data-source.ts pida SSL contra el Postgres local
      #DB_HOST: db
      #DB_PORT: 5432
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@DB_HOST:DB_PORT/${DB_NAME:-colibri_db}
    #depends_on:
      #db:
        #condition: service_healthy
    command: ["npm", "run", "migration:run"]

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      NODE_ENV: development
      #DB_HOST: db
      #DB_PORT: 5432
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@DB_HOST:DB_PORT/${DB_NAME:-colibri_db}
    #depends_on:
      #db:
        #condition: service_healthy
    command: ["npm", "run", "seed"]

volumes:
  pgdata:
